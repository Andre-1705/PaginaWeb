<head>
    <meta charset="UTF-8">

    <link rel="shortcut icon" href="img/icono_computadora.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="layout-flex">

<!-- header -->
<header class="header">
    <div class="header_slogan_logo">
        <svg class="header_logo_link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span>Libros on line</span>
    </div>
    <div class="header_menu">
        <a href="index.html">Inicio</a>
        <a href="registrarse.html">Registrarse</a>
        <a href="inicio_sesion.html">Iniciar Sesi&oacute;n</a>
    </div>
</header>

<!-- formulario -->
<main class="contenido-principal">
    <div class="form-container">
        <h2>Reg&iacute;strate</h2>
        <form class="formulario_registro">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan">
            </div>
            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="apellido" placeholder="Ej: P&eacute;rez">
            </div>
            <div class="mb-3">
                <label for="dni" class="form-label">DNI</label>
                <input type="text" class="form-control" id="dni" placeholder="Ej: 12345678">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Ej: correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Tel&eacute;fono</label>
                <input type="text" class="form-control" id="telefono" placeholder="Ej: 1122334455">
            </div>
            <div class="mb-3">
                <label for="pais" class="form-label">Pa&iacute;s</label>
                <input type="text" class="form-control" id="pais" placeholder="Ej: Argentina">
            </div>
            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
        </form>
    </div>
</main>

<!-- footer -->
<footer class="footer">
    <nav class="navegador">
        <div>
            <a href="#">T&eacute;rminos y condiciones</a>
            <a href="#">Preguntas frecuentes</a>
            <a href="#">Ayuda</a>
        </div>
    </nav>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
